# Android release AAB 자동 빌드.
# main push 또는 v* 태그 시 트리거. 결과물(.aab) 은 GitHub Actions artifact 로 업로드.
# Play Console 자동 업로드 (fastlane / Google Play API) 는 후속 작업 — 현재는 수동 다운로드.
#
# ── 필요 시크릿 (Repo Settings → Secrets and variables → Actions) ────
#   ANDROID_KEYSTORE_BASE64    — babynote-release.jks 를 base64 인코딩한 문자열
#   KEYSTORE_PASSWORD          — keystore 비밀번호
#   KEY_PASSWORD               — key alias 비밀번호
#   KEY_ALIAS                  — babynote
#   SUPABASE_URL               — production Supabase URL
#   SUPABASE_ANON_KEY          — production anon key
#   SENTRY_DSN                 — (선택) prod Sentry DSN
#   REVENUECAT_ANDROID_KEY     — RevenueCat Android API key
#
# 자세한 시크릿 셋업: docs/release/ci_cd.md

name: build-android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # 수동 트리거

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Cache pub + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: pub get
        run: flutter pub get

      - name: Decode keystore
        # 시크릿이 비어있으면 빌드 자체는 가능 (debug 서명 fallback) — 출시용 AAB 는 시크릿 필수.
        # base64 -d -i: invalid (줄바꿈/공백/CR) 문자 무시 → Windows certutil / PowerShell
        #   복사 시 섞이는 CRLF·헤더라도 통과. tr 로 base64 알파벳 외 문자는 모두 제거.
        #
        # 진단(Diagnostics) 출력: 시크릿 자체는 노출하지 않고 길이·문자 분포·복호 잔여물만
        # 보여줘서 어떤 종류의 손상인지 (truncation / BOM / cert 헤더 등) 파악 가능.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # ── 진단 ──────────────────────────────────────────────────────
          RAW_LEN=${#ANDROID_KEYSTORE_BASE64}
          CLEAN=$(printf %s "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | tr -cd 'A-Za-z0-9+/=')
          CLEAN_LEN=${#CLEAN}
          echo "raw secret length     : $RAW_LEN"
          echo "cleaned base64 length : $CLEAN_LEN  (must be multiple of 4 — currently $((CLEAN_LEN % 4)) leftover)"
          # 비-base64 문자 종류만 출력 (값은 노출 안 됨)
          STRIPPED=$(printf %s "$ANDROID_KEYSTORE_BASE64" | tr -d 'A-Za-z0-9+/=' | od -c | head -3)
          echo "non-base64 chars seen (od -c):"
          echo "$STRIPPED"
          # BEGIN/END CERTIFICATE 헤더 흔적
          if printf %s "$ANDROID_KEYSTORE_BASE64" | grep -q "BEGIN\|END\|CERTIFICATE"; then
            echo "::error::secret looks like certutil output (BEGIN/END headers) — must be raw base64 only"
          fi
          # 출시용 jks 는 보통 2.5KB 정도 → base64 는 약 3,400자. 1000자 미만이면 잘렸을 가능성 높음.
          if [ "$CLEAN_LEN" -lt 1000 ]; then
            echo "::error::cleaned base64 only $CLEAN_LEN chars — secret was likely truncated on paste"
          fi
          # ── 실제 디코드 ──────────────────────────────────────────────
          printf %s "$CLEAN" | base64 -d > android/app/babynote-release.jks
          ls -la android/app/babynote-release.jks
          # 키스토어 형식 검증.
          #   JKS  : 앞 4 바이트 = FE ED FE ED         → xxd "feedfeed"
          #   PKCS12: 앞 2 바이트 = 30 82 (DER SEQUENCE) → xxd "3082"  (JDK 9+ keytool 기본)
          # Android Gradle 은 둘 다 처리 가능. 형식 자체가 다른 바이너리면 fail.
          MAGIC=$(head -c 4 android/app/babynote-release.jks | xxd -p)
          case "$MAGIC" in
            feedfeed*) echo "✅ JKS keystore detected (magic: $MAGIC)" ;;
            3082*)     echo "✅ PKCS12 keystore detected (magic: $MAGIC)" ;;
            *)         echo "::error::unknown keystore format — magic bytes: $MAGIC"; exit 1 ;;
          esac

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=babynote-release.jks
          EOF

      - name: Build AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          AFFILIATE_COUPANG_SUBID: ${{ secrets.AFFILIATE_COUPANG_SUBID }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=AFFILIATE_COUPANG_SUBID="$AFFILIATE_COUPANG_SUBID" \
            --dart-define=FLAVOR=prod

      - name: Build debug APK (sideload용)
        # debug APK 도 같이 만들어 두면 베타 테스터가 빠르게 sideload 가능
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          AFFILIATE_COUPANG_SUBID: ${{ secrets.AFFILIATE_COUPANG_SUBID }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=AFFILIATE_COUPANG_SUBID="$AFFILIATE_COUPANG_SUBID" \
            --dart-define=FLAVOR=prod

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/babynote-release.jks android/key.properties
